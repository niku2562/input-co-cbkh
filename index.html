<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Input CO - CBKH</title>
  <style>
    :root {
      --primary: #634A4A;
      --primary-hover: #4e3939;
      --primary-soft: #f5f0f0;
      --primary-border: #d8cece;
      --bg-page: #f7f4f4;
      --text-main: #2b2121;
      --text-muted: #786868;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      line-height: 1.45;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 14px;
      border-top: 4px solid var(--primary);
      box-shadow: 0 4px 20px rgba(99, 74, 74, 0.08);
    }

    .login-box {
      max-width: 380px;
      margin: 48px auto;
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 14px;
      border-top: 4px solid var(--primary);
      box-shadow: 0 6px 24px rgba(99, 74, 74, 0.1);
    }

    h2 {
      margin: 0 0 6px 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.2px;
    }

    p.subtitle {
      margin: 0 0 20px 0;
      font-size: 13px;
      color: var(--text-muted);
      border-bottom: 1px solid #ede7e7;
      padding-bottom: 14px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid #ede7e7;
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    .top-bar p {
      margin: 4px 0 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    .btn-logout {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--primary-border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-logout:hover {
      background: #ebe2e2;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #4a3c3c;
    }

    label span.req {
      color: #c53030;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--primary-border);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-main);
      background: #ffffff;
      box-sizing: border-box;
      font-family: inherit;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 74, 74, 0.14);
    }

    input[readonly] {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: #e3dada;
      font-weight: 600;
      cursor: not-allowed;
    }

    .manual-input {
      margin-top: 8px;
      display: none;
      background: #fdfaf7;
      border-color: #b78d65;
    }

    .item-card {
      background: #fcfafa;
      border: 1px solid #e6dede;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--primary-border);
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .btn-duplikat {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--primary-border);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-duplikat:hover {
      background: #ebe2e2;
    }

    .btn-hapus {
      background: #fdf2f2;
      color: #b91c1c;
      border: 1px solid #f5d0d0;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-tambah {
      width: 100%;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1.5px dashed #b8a6a6;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 14px;
      transition: all 0.2s ease;
    }

    .btn-tambah:hover {
      background: #efe8e8;
      border-color: var(--primary);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(99, 74, 74, 0.22);
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      background: #b5a8a8;
      box-shadow: none;
      cursor: not-allowed;
    }

    #status, #loginStatus {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .row-2 { grid-template-columns: 1fr; gap: 0; }
      body { padding: 10px; }
      .container { padding: 18px 16px; }
    }
  </style>
</head>
<body>

<!-- HALAMAN LOGIN MEMBER -->
<div class="login-box" id="login-screen">
  <h2>Login Member CBKH</h2>
  <p class="subtitle">Masukkan Username dan Password resmi Anda untuk mengakses formulir CO.</p>
  
  <div class="form-group">
    <label>Username <span class="req">*</span></label>
    <input type="text" id="loginUser" placeholder="Masukkan username..." autocomplete="username">
  </div>
  
  <div class="form-group">
    <label>Password <span class="req">*</span></label>
    <input type="password" id="loginPass" placeholder="Masukkan password..." autocomplete="current-password">
  </div>

  <button type="button" class="btn-submit" id="btnLogin">Masuk</button>
  <div id="loginStatus"></div>
</div>

<!-- HALAMAN FORMULIR UTAMA (TERSEMBUNYI SEBELUM LOGIN) -->
<div class="container" id="form-screen" style="display:none;">
  <div class="top-bar">
    <div>
      <h2>Laporan Input CO - CBKH</h2>
      <p>Identitas otomatis terkunci sesuai akun member.</p>
    </div>
    <button type="button" class="btn-logout" id="btnLogout">Keluar</button>
  </div>
  
  <div class="section-title">1. Data Member</div>
  <div class="row-2">
    <div class="form-group">
      <label>Nama Asli / Nama DANA</label>
      <input type="text" id="namaAsli" readonly>
    </div>
    <div class="form-group">
      <label>Nomor DANA</label>
      <input type="tel" id="noDana" readonly>
    </div>
  </div>

  <div class="section-title" style="margin-top: 18px;">2. Daftar Pesanan</div>
  <div id="items-container"></div>

  <button type="button" class="btn-tambah" id="btnTambah">+ Tambah Pesanan Baru (Kosong)</button>
  <button type="button" class="btn-submit" id="btnSubmit">Kirim Semua Data CO</button>
  <div id="status"></div>
</div>

<template id="card-template">
  <div class="item-card">
    <div class="item-header">
      <span class="card-title">Pesanan #1</span>
      <div class="card-actions">
        <button type="button" class="btn-duplikat">Duplikat</button>
        <button type="button" class="btn-hapus">Hapus</button>
      </div>
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>APK yang Digunakan CO <span class="req">*</span></label>
        <select class="apk">
          <option value="LAZADA">LAZADA</option>
          <option value="TIKTOK">TIKTOK</option>
          <option value="TOKOPEDIA">TOKOPEDIA</option>
          <option value="SHOPEE">SHOPEE</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nama Penerima (di APK) <span class="req">*</span></label>
        <input type="text" class="namaPenerima" placeholder="Nama akun/penerima" required>
      </div>
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>Nama Produk / Varian <span class="req">*</span></label>
        <select class="produkSelect"></select>
        <input type="text" class="produkManual manual-input" placeholder="Ketik nama produk manual...">
      </div>
      <div class="form-group">
        <label>Jumlah / Quantity CO <span class="req">*</span></label>
        <input type="number" class="qty" value="1" min="1" required>
      </div>
    </div>

    <div class="form-group">
      <label>Alamat Pesanan <span class="req">*</span></label>
      <select class="alamatSelect"></select>
      <input type="text" class="alamatManual manual-input" placeholder="Ketik alamat pesanan manual...">
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>Harga Didapat Saat CO <span class="req">*</span></label>
        <input type="number" class="hargaCo" placeholder="Angka saja, cth: 278152" required>
      </div>
      <div class="form-group">
        <label>Harga Max (Patokan Admin)</label>
        <input type="number" class="hargaMax" placeholder="Angka saja, cth: 279000">
      </div>
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>Nomer ID Pesanan <span class="req">*</span></label>
        <input type="text" class="noPesanan" placeholder="Tempel ID pesanan" required>
      </div>
      <div class="form-group">
        <label>Nomer Resi Pesanan</label>
        <input type="text" class="noResi" placeholder="Isi jika sudah keluar resi">
      </div>
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>Keterangan Pengiriman <span class="req">*</span></label>
        <select class="ketPengiriman">
          <option value="BARANG DITERIMA">BARANG DITERIMA</option>
          <option value="DALAM PENGIRIMAN">DALAM PENGIRIMAN</option>
          <option value="DIKEMAS">DIKEMAS</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nama Kurir</label>
        <input type="text" class="namaKurir" placeholder="Wajib diisi jika ada">
      </div>
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>Tanggal Order <span class="req">*</span></label>
        <input type="date" class="tglOrder" required>
      </div>
      <div class="form-group">
        <label>Tanggal Diterima</label>
        <input type="date" class="tglDiterima">
      </div>
    </div>

    <div class="form-group" style="margin-bottom:0;">
      <label>Screenshot Pesanan (Kelihatan alamat, nopes, resi, harga COD) <span class="req">*</span></label>
      <input type="file" class="ssFile" accept="image/*" required>
    </div>
  </div>
</template>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbx1L8GlgdZ5K_4byjv2kKif5cWX7hPO3jn3VPcWE5O2uDg1S-2rAuPBDp--EeFLpsoJhg/exec';
  let currentUser = { username: '', password: '' };

  let masterData = {
    produk: [
      "SWEETY VARIAN XL42", "SWEETY VARIAN L54", "SGM 1+ MADU", "SGM 1+ VANILA",
      "Vidoran 1+ 900", "Merries XL38", "Merries L42", "Merries M48",
      "Xiaomi Google TV A 32 2026", "4/64 Infinix Smart 20", "4/128 Infinix Smart 20",
      "4/256 Infinix Smart 20", "6/128 Infinix Smart 20E", "4/128 Infinix Hot 70",
      "6/128 Infinix Hot 70", "6/256 Infinix Hot 70", "8/128 Infinix Hot 70",
      "6/128 Itel A300", "3/32 Itel A100c", "4/128 Poco C71", "4/128 Poco C81 Pro",
      "6/128 Poco C95 Pro", "8/256 Poco C95 Pro", "4/64 Realme Note 80",
      "4/128 Realme Note 80", "4/64 Realme P4 Lite", "4/128 Realme P4X",
      "4/64 Samsung A07", "4/128 Samsung A07", "8/128 Samsung A17",
      "4/64 Tecno Spark Go 3", "4/64 Vivo Y03t", "4/128 Vivo Y03t",
      "4/64 Vivo Y19s Pro", "4/128 Vivo Y19s Pro"
    ],
    alamat: [
      "Blok MA", "BLOK ASOKA", "BLOK OGI", "GADING KIRANA",
      "Glodok City Cibinong Elektronik", "Duta suara elektronik",
      "Wahyu Beringin", "MLATI SA"
    ]
  };

  function bukaFormulir(user, pass, namaAsli, noDana) {
    currentUser = { username: user, password: pass };
    document.getElementById('namaAsli').value = namaAsli;
    document.getElementById('noDana').value = noDana;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('form-screen').style.display = 'block';
    
    if (document.querySelectorAll('.item-card').length === 0) {
      tambahBaris();
    }
    muatMasterData();
  }

  async function prosesLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    const statusEl = document.getElementById('loginStatus');
    const btn = document.getElementById('btnLogin');

    if (!user || !pass) {
      statusEl.style.color = '#dc2626';
      statusEl.innerText = 'Isi Username dan Password terlebih dahulu.';
      return;
    }

    btn.disabled = true;
    btn.innerText = 'Memeriksa akun...';
    statusEl.innerText = '';

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', username: user, password: pass })
      });
      const res = await response.json();

      if (res.status === 'sukses') {
        localStorage.setItem('cbkh_auth', JSON.stringify({
          username: user,
          password: pass,
          namaAsli: res.namaAsli,
          noDana: res.noDana
        }));
        bukaFormulir(user, pass, res.namaAsli, res.noDana);
      } else {
        statusEl.style.color = '#dc2626';
        statusEl.innerText = res.pesan;
      }
    } catch (e) {
      statusEl.style.color = '#dc2626';
      statusEl.innerText = 'Koneksi gagal: ' + e;
    } finally {
      btn.disabled = false;
      btn.innerText = 'Masuk';
    }
  }

  function logoutMember() {
    localStorage.removeItem('cbkh_auth');
    currentUser = { username: '', password: '' };
    document.getElementById('loginPass').value = '';
    document.getElementById('form-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'block';
  }

  function isiOpsiDropdown(selectEl, daftarOpsi, labelKosong) {
    const nilaiSebelumnya = selectEl.value;
    selectEl.innerHTML = '';
    const optDefault = document.createElement('option');
    optDefault.value = '';
    optDefault.text = '-- Pilih ' + labelKosong + ' --';
    selectEl.appendChild(optDefault);

    for (let i = 0; i < daftarOpsi.length; i++) {
      const opt = document.createElement('option');
      opt.value = daftarOpsi[i];
      opt.text = daftarOpsi[i];
      selectEl.appendChild(opt);
    }

    const optManual = document.createElement('option');
    optManual.value = '__MANUAL__';
    optManual.text = '+ Ketik Manual (Lainnya)';
    selectEl.appendChild(optManual);

    if (nilaiSebelumnya) selectEl.value = nilaiSebelumnya;
  }

  function tambahBaris(dataSalinan) {
    const container = document.getElementById('items-container');
    const template = document.getElementById('card-template');
    const clone = template.content.cloneNode(true);
    const card = clone.querySelector('.item-card');

    const produkSelect = card.querySelector('.produkSelect');
    const produkManual = card.querySelector('.produkManual');
    const alamatSelect = card.querySelector('.alamatSelect');
    const alamatManual = card.querySelector('.alamatManual');

    isiOpsiDropdown(produkSelect, masterData.produk, 'Produk / Varian');
    isiOpsiDropdown(alamatSelect, masterData.alamat, 'Alamat');

    produkSelect.addEventListener('change', function() {
      produkManual.style.display = (this.value === '__MANUAL__') ? 'block' : 'none';
    });

    alamatSelect.addEventListener('change', function() {
      alamatManual.style.display = (this.value === '__MANUAL__') ? 'block' : 'none';
    });

    if (dataSalinan) {
      card.querySelector('.apk').value = dataSalinan.apk;
      card.querySelector('.namaPenerima').value = dataSalinan.namaPenerima;
      produkSelect.value = dataSalinan.produkSelectVal;
      if (dataSalinan.produkSelectVal === '__MANUAL__') {
        produkManual.style.display = 'block';
        produkManual.value = dataSalinan.produkManualVal;
      }
      card.querySelector('.qty').value = dataSalinan.qty;
      alamatSelect.value = dataSalinan.alamatSelectVal;
      if (dataSalinan.alamatSelectVal === '__MANUAL__') {
        alamatManual.style.display = 'block';
        alamatManual.value = dataSalinan.alamatManualVal;
      }
      card.querySelector('.hargaCo').value = dataSalinan.hargaCo;
      card.querySelector('.hargaMax').value = dataSalinan.hargaMax;
      card.querySelector('.ketPengiriman').value = dataSalinan.ketPengiriman;
      card.querySelector('.namaKurir').value = dataSalinan.namaKurir;
      card.querySelector('.tglOrder').value = dataSalinan.tglOrder;
      card.querySelector('.tglDiterima').value = dataSalinan.tglDiterima;
    }

    card.querySelector('.btn-duplikat').addEventListener('click', function() {
      tambahBaris({
        apk: card.querySelector('.apk').value,
        namaPenerima: card.querySelector('.namaPenerima').value,
        produkSelectVal: produkSelect.value,
        produkManualVal: produkManual.value,
        qty: card.querySelector('.qty').value,
        alamatSelectVal: alamatSelect.value,
        alamatManualVal: alamatManual.value,
        hargaCo: card.querySelector('.hargaCo').value,
        hargaMax: card.querySelector('.hargaMax').value,
        ketPengiriman: card.querySelector('.ketPengiriman').value,
        namaKurir: card.querySelector('.namaKurir').value,
        tglOrder: card.querySelector('.tglOrder').value,
        tglDiterima: card.querySelector('.tglDiterima').value
      });
    });

    card.querySelector('.btn-hapus').addEventListener('click', function() {
      card.remove();
      perbaruiNomorKartu();
    });

    container.appendChild(card);
    perbaruiNomorKartu();
  }

  function perbaruiNomorKartu() {
    const cards = document.querySelectorAll('.item-card');
    for (let i = 0; i < cards.length; i++) {
      cards[i].querySelector('.card-title').innerText = 'Pesanan #' + (i + 1);
      cards[i].querySelector('.btn-hapus').style.display = (cards.length > 1) ? 'inline-block' : 'none';
    }
  }

  function bacaFile(file) {
    return new Promise((resolve, reject) => {
      if (!file) return resolve({ fileData: null, fileName: null });
      const reader = new FileReader();
      reader.onload = () => resolve({ fileData: reader.result, fileName: file.name });
      reader.onerror = error => reject(error);
      reader.readAsDataURL(file);
    });
  }

  async function prosesKirim() {
    const cards = document.querySelectorAll('.item-card');
    const statusDiv = document.getElementById('status');
    const btn = document.getElementById('btnSubmit');

    btn.disabled = true;
    btn.innerText = 'Memproses gambar & data...';
    statusDiv.innerText = '';

    try {
      const items = [];
      for (let i = 0; i < cards.length; i++) {
        const card = cards[i];
        const apk = card.querySelector('.apk').value;
        const namaPenerima = card.querySelector('.namaPenerima').value.trim();
        const produkSel = card.querySelector('.produkSelect').value;
        const namaProduk = (produkSel === '__MANUAL__') ? card.querySelector('.produkManual').value.trim() : produkSel;
        const qty = card.querySelector('.qty').value.trim();
        const alamatSel = card.querySelector('.alamatSelect').value;
        const alamat = (alamatSel === '__MANUAL__') ? card.querySelector('.alamatManual').value.trim() : alamatSel;
        const hargaCo = card.querySelector('.hargaCo').value.trim();
        const hargaMax = card.querySelector('.hargaMax').value.trim();
        const noPesanan = card.querySelector('.noPesanan').value.trim();
        const noResi = card.querySelector('.noResi').value.trim();
        const ketPengiriman = card.querySelector('.ketPengiriman').value;
        const namaKurir = card.querySelector('.namaKurir').value.trim();
        const tglOrder = card.querySelector('.tglOrder').value;
        const tglDiterima = card.querySelector('.tglDiterima').value;
        const fileInput = card.querySelector('.ssFile');

        if (!namaPenerima || !namaProduk || !qty || !alamat || !hargaCo || !noPesanan || !tglOrder || !fileInput.files[0]) {
          alert('Harap lengkapi semua kolom wajib (*) dan upload screenshot pada Pesanan #' + (i + 1) + '.');
          btn.disabled = false;
          btn.innerText = 'Kirim Semua Data CO';
          return;
        }

        const fileObj = await bacaFile(fileInput.files[0]);
        items.push({
          apk, namaPenerima, namaProduk, qty, alamat,
          hargaCo, hargaMax, noPesanan, noResi,
          ketPengiriman, namaKurir, tglOrder, tglDiterima,
          fileData: fileObj.fileData,
          fileName: fileObj.fileName
        });
      }

      btn.innerText = 'Menyimpan ke Spreadsheet...';
      const response = await fetch(API_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'submit',
          username: currentUser.username,
          password: currentUser.password,
          items
        })
      });
      const res = await response.json();

      if (res.status === 'sukses') {
        statusDiv.style.color = '#16a34a';
        statusDiv.innerText = 'Berhasil! ' + res.jumlah + ' pesanan telah masuk ke database.';
        document.getElementById('items-container').innerHTML = '';
        tambahBaris();
      } else {
        statusDiv.style.color = '#dc2626';
        statusDiv.innerText = 'Gagal: ' + res.pesan;
      }
    } catch (e) {
      statusDiv.style.color = '#dc2626';
      statusDiv.innerText = 'Koneksi gagal: ' + e;
    } finally {
      btn.disabled = false;
      btn.innerText = 'Kirim Semua Data CO';
    }
  }

  function muatMasterData() {
    fetch(API_URL, { redirect: 'follow' })
      .then(r => r.json())
      .then(data => {
        if (data && data.produk && data.produk.length > 0) masterData.produk = data.produk;
        if (data && data.alamat && data.alamat.length > 0) masterData.alamat = data.alamat;
        document.querySelectorAll('.item-card').forEach(card => {
          isiOpsiDropdown(card.querySelector('.produkSelect'), masterData.produk, 'Produk / Varian');
          isiOpsiDropdown(card.querySelector('.alamatSelect'), masterData.alamat, 'Alamat');
        });
      })
      .catch(() => {});
  }

  document.getElementById('btnLogin').addEventListener('click', prosesLogin);
  document.getElementById('btnLogout').addEventListener('click', logoutMember);
  document.getElementById('btnTambah').addEventListener('click', () => tambahBaris());
  document.getElementById('btnSubmit').addEventListener('click', prosesKirim);

  const savedAuth = localStorage.getItem('cbkh_auth');
  if (savedAuth) {
    try {
      const parsed = JSON.parse(savedAuth);
      if (parsed.username && parsed.password) {
        bukaFormulir(parsed.username, parsed.password, parsed.namaAsli, parsed.noDana);
      }
    } catch (e) {}
  }
</script>

</body>
</html>
